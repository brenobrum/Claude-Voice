<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Message history</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="history.css">
</head>
<body class="history">
  <header>
    <div class="title"><span>History</span><span id="count"></span></div>
    <span class="head-actions">
      <button id="clearBtn" class="icon" title="Clear history" aria-label="Clear history">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
      </button>
      <button id="closeBtn" class="icon" title="Hide panel" aria-label="Hide panel">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </span>
  </header>
  <main id="log">
    <div class="empty" id="empty">No messages yet.<br>What you send and what Claude answers shows up here.</div>
  </main>
  <script src="history.js"></script>
</body>
</html>
