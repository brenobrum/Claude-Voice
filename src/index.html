<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; style-src 'self' 'unsafe-inline'">
  <title>Claude Voice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <button id="historyBtn" class="icon history-btn" title="Message history" aria-label="Message history">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 14h4.5"/></svg>
    </button>
    <div class="title"><span id="dot" class="dot"></span><span>Claude Voice</span></div>
    <span class="head-actions">
    <button id="agentsBtn" class="icon agents-btn" title="Sub-agents panel" aria-label="Sub-agents panel">
      <span id="agentsDot" class="adot"></span><span id="agentsCount">0</span>
    </button>
    <button id="settingsBtn" class="icon" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    </span>
  </header>

  <main class="stage">
    <canvas id="orb" title="Space to open / close the mic"></canvas>
    <div id="caption"></div>
    <div id="perm"></div>
  </main>

  <footer>
    <div id="contextBox" hidden>
      <textarea id="contextInput" rows="1" placeholder="Add context for your next message…" title="Enter to attach · Shift+Enter for a new line · Esc to close"></textarea>
    </div>
    <div class="controls">
      <span></span>
      <button id="micBtn" class="mic" title="Mic on / off (Space)" aria-label="Toggle microphone">
        <svg class="mic-on" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10.5a1 1 0 0 1 2 0 5 5 0 0 0 10 0 1 1 0 0 1 2 0 7 7 0 0 1-6 6.93V20h3a1 1 0 0 1 0 2H8a1 1 0 0 1 0-2h3v-2.57a7 7 0 0 1-6-6.93z"/></svg>
        <svg class="mic-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v2a3 3 0 0 0 5.12 2.12"/><path d="M17 16.95A7 7 0 0 1 5 11v-1"/><path d="M19 10v1a7 7 0 0 1-.11 1.23"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      </button>
      <button id="contextBtn" class="ctx" title="Add typed context to your next voice message" aria-label="Add text context">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 15.5h6"/></svg>
      </button>
    </div>
    <div id="status">Not connected</div>
    <div id="folder"></div>
    <div class="hint"><kbd>Space</kbd> mic on / off · <kbd>Esc</kbd> stop Claude talking</div>
  </footer>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>
      <label>OpenAI API key<input name="openaiKey" type="password" placeholder="sk-…"></label>
      <div class="row2">
        <label>Voice engine
          <select name="ttsEngine">
            <option value="realtime">GPT-Realtime (reads Claude verbatim)</option>
            <option value="live">GPT-Live (full duplex, paraphrases)</option>
            <option value="tts">TTS (cheapest)</option>
          </select>
        </label>
        <label>Voice
          <select name="voice">
            <option>marin</option><option>cedar</option>
            <optgroup label="GPT-Live only">
              <option value="bossa">bossa (PT-BR, feminine)</option><option value="tempo">tempo (PT-BR, masculine)</option>
              <option>gleam</option><option>meridian</option><option>vesper</option><option>willow</option>
              <option>stone</option><option>ripple</option><option>quartz</option><option>delta</option>
              <option>cinder</option><option>beacon</option>
            </optgroup>
            <optgroup label="All engines">
              <option>alloy</option><option>ash</option><option>ballad</option><option>coral</option>
              <option>echo</option><option>sage</option><option>shimmer</option><option>verse</option>
            </optgroup>
          </select>
        </label>
      </div>
      <label>GPT-Live model<input name="liveModel"></label>
      <div class="row2">
        <label>Realtime voice model<input name="realtimeModel"></label>
        <label>TTS model<input name="ttsModel"></label>
      </div>
      <div class="row2">
        <label>Transcription model<input name="sttModel"></label>
        <label>Language (ISO, optional)<input name="language" placeholder="pt (default), en…"></label>
      </div>
      <div class="row2">
        <label>End-of-turn silence (ms)<input name="silenceMs" type="number" min="200" max="3000" step="50"></label>
        <label>Global hotkey<input name="hotkey" placeholder="Alt+Space"></label>
      </div>
      <label class="check"><input type="checkbox" name="bargeIn"> Interrupt by talking over Claude</label>
      <div class="actions">
        <button type="button" id="testVoice" class="ghost">Test voice</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate class="ghost">Cancel</button><button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="orb.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
